name: Publish to NuGet

# Runs when a version tag like v2.1.0 (or v2.1.0-beta.1) is pushed.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Get version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: >
          dotnet pack src/OF.BasicMapper
          --configuration Release
          --output artifacts
          -p:Version=${{ steps.version.outputs.value }}

      # Exchanges a GitHub OIDC token for a short-lived nuget.org API key.
      # Needs a Trusted Publishing policy on nuget.org and a NUGET_USER secret (your nuget.org username).
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --title "$GITHUB_REF_NAME"
          --generate-notes
          ${{ contains(steps.version.outputs.value, '-') && '--prerelease' || '' }}
